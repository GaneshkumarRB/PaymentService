server:
  port: 8080

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:file:./data/payments;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

payment:
  supported-currencies: USD,EUR,GBP
  outbox:
    poll-interval-ms: 500
    batch-size: 50
  messaging:
    worker-threads: 4
    max-attempts: 5
    initial-backoff-ms: 200
    max-backoff-ms: 5000
    backoff-multiplier: 2.0
  fraud:
    base-url: http://localhost:8080
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    enabled-stub: true

fraud-stub:
  # Postman: amount < 1000 ACCEPT, >= 1000 DECLINE, >= 5000 vendor FAILURE
  risk-amount-threshold: 1000
  failure-amount-threshold: 5000
  min-latency-ms: 50
  max-latency-ms: 400

logging:
  level:
    com.bnk.paymentservice: INFO
