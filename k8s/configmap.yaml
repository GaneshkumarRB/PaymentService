apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: payments
  labels:
    app.kubernetes.io/name: payment-service
data:
  SPRING_APPLICATION_NAME: payment-service
  SERVER_PORT: "8080"
  PAYMENT_SUPPORTED_CURRENCIES: USD,EUR,GBP
  PAYMENT_OUTBOX_POLL_INTERVAL_MS: "500"
  PAYMENT_OUTBOX_BATCH_SIZE: "50"
  PAYMENT_MESSAGING_WORKER_THREADS: "4"
  PAYMENT_MESSAGING_MAX_ATTEMPTS: "5"
  PAYMENT_MESSAGING_INITIAL_BACKOFF_MS: "200"
  PAYMENT_MESSAGING_MAX_BACKOFF_MS: "5000"
  PAYMENT_FRAUD_BASE_URL: http://fraud-provider.payments.svc.cluster.local:8080
  PAYMENT_FRAUD_CONNECT_TIMEOUT_MS: "2000"
  PAYMENT_FRAUD_READ_TIMEOUT_MS: "5000"
  PAYMENT_FRAUD_ENABLED_STUB: "false"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
